<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Distill reader</title>
  <link rel="icon" href="icons/icon32.png">
  <link rel="stylesheet" href="content.css">
  <link rel="stylesheet" href="reader.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <div class="titles">
      <div id="title">Loading PDF…</div>
      <a id="source" target="_blank" rel="noopener"></a>
    </div>
    <div class="hint">Highlight text, right-click, <b>Distill</b>. <span id="undo-key">Ctrl+Z</span> undoes.</div>
    <a id="original" class="button" target="_self">Original PDF</a>
  </header>
  <main id="doc" aria-live="polite">
    <div id="status"><span class="distill-spinner"></span> Extracting text…</div>
  </main>
  <script src="content.js"></script>
  <script type="module" src="reader.js"></script>
</body>
</html>
