<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Distill options</title>
  <style>
    body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 16px; min-width: 320px; color: #1f2328; }
    label { display: flex; gap: 10px; align-items: flex-start; margin: 0 0 14px; cursor: pointer; }
    label span { display: block; }
    small { color: #656d76; display: block; }
    @media (prefers-color-scheme: dark) { body { background: #1c1f23; color: #e6e8eb; } small { color: #9da7b3; } }
  </style>
</head>
<body>
  <label>
    <input type="checkbox" id="plain">
    <span>Plain mode
      <small>Prefer plainer sentences, drop asides, split long sentences, swap a few hard words, and spell out abbreviations.</small></span>
  </label>
  <label>
    <input type="checkbox" id="glossary">
    <span>Glossary
      <small>Under the distilled text, explain the abbreviations it uses, in the document's own words.</small></span>
  </label>
  <script src="options.js"></script>
</body>
</html>
